<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Parallelism Explorer · 并行切分可视化</title>
<style>
/* 离线版自带一份最小主题变量，对齐文档站 extra.css 的取值 */
:root {
  --md-text-font: "Inter", "Noto Sans SC", system-ui, sans-serif;
  --md-code-font: "JetBrains Mono", "Cascadia Code", ui-monospace, monospace;
  --vllm-ink: #111827; --vllm-slate: #334155; --vllm-muted: #64748b;
  --vllm-line: #e2e8f0; --vllm-paper: #f8fafc; --vllm-accent: #3b82f6;
}
body[data-md-color-scheme="slate"] {
  --vllm-ink: #f8fafc; --vllm-slate: #dbe4ef; --vllm-muted: #94a3b8;
  --vllm-line: #263244; --vllm-paper: #121923; --vllm-accent: #60a5fa;
}
html, body { margin: 0; padding: 0; }
body {
  background: var(--vllm-paper);
  color: var(--vllm-ink);
  font-family: var(--md-text-font);
  font-size: 16px;
}
body[data-md-color-scheme="slate"] { background: #0b1119; }
.page { max-width: 84rem; margin: 0 auto; padding: 1.6rem 1.2rem 5rem; }
.themebtn {
  position: fixed; top: .8rem; right: .9rem; z-index: 9;
  padding: .32rem .8rem; border: 1px solid var(--vllm-line); border-radius: .4rem;
  background: var(--vllm-paper); color: var(--vllm-muted);
  font-family: var(--md-code-font); font-size: .72rem; font-weight: 700; cursor: pointer;
}
</style>
<style data-pe-style="1">
/* ==========================================================================
   Parallelism Explorer — 并行切分可视化
   样式跟随站点主题（Material palette + extra.css 的 --vllm-* 变量）
   所有规则都限定在 .pe 作用域内，避免污染其它文章页。
   ========================================================================== */

.pe {
  /* --- 面板与文字：由站点变量派生 --- */
  --pe-fg: var(--vllm-ink, #111827);
  --pe-slate: var(--vllm-slate, #334155);
  --pe-dim: var(--vllm-muted, #64748b);
  --pe-line: var(--vllm-line, #e2e8f0);
  --pe-panel: var(--vllm-paper, #f8fafc);
  --pe-panel2: #ffffff;
  --pe-accent: var(--vllm-accent, #3b82f6);
  --pe-shadow: 0 0.35rem 1.1rem rgba(15, 23, 42, 0.06);

  /* --- SVG 用色（inline SVG 继承 CSS 变量） --- */
  --pe-svg-fg: #1f2937;
  --pe-svg-dim: #64748b;
  --pe-svg-faint: #94a3b8;
  --pe-svg-line: #cbd5e1;
  --pe-svg-neutral: #e2e8f0;
  --pe-svg-cell-off: #f1f5f9;
  --pe-hatch-bg: #e8edf4;
  --pe-hatch-line: #94a3b8;
  --pe-on-shard: #ffffff;
  --pe-on-shard-dim: #64748b;

  /* --- 语义色 --- */
  --pe-warn: #d97706;
  --pe-warn-bg: #fffbeb;
  --pe-warn-line: #fcd34d;
  --pe-err: #dc2626;
  --pe-err-bg: #fef2f2;
  --pe-err-line: #fca5a5;
  --pe-ok: #059669;
  --pe-ok-bg: #ecfdf5;
  --pe-ok-line: #6ee7b7;

  /* --- 并行维度色 --- */
  --pe-tp: #2563eb;
  --pe-pcp: #d97706;
  --pe-dcp: #0d9488;
  --pe-pp: #7c3aed;
  --pe-dp: #db2777;
  --pe-ep: #a16207;
  --pe-sp: #0891b2;
  --pe-uly: #059669;
  --pe-ring: #0284c7;
  --pe-cfg: #c026d3;
  --pe-vae: #ea580c;
  --pe-txt: #6d28d9;

  margin: 0 0 2rem;
  color: var(--pe-fg);
  font-size: 0.76rem;
  line-height: 1.6;
}

[data-md-color-scheme="slate"] .pe {
  --pe-panel: #0f1720;
  --pe-panel2: #0b1119;
  --pe-shadow: none;

  --pe-svg-fg: #e2e8f0;
  --pe-svg-dim: #94a3b8;
  --pe-svg-faint: #64748b;
  --pe-svg-line: #334155;
  --pe-svg-neutral: #253242;
  --pe-svg-cell-off: #131c27;
  --pe-hatch-bg: #22303f;
  --pe-hatch-line: #6b8ab0;
  --pe-on-shard: #0b1119;
  --pe-on-shard-dim: #8095ad;

  --pe-warn: #fbbf24;
  --pe-warn-bg: #241c0e;
  --pe-warn-line: #78551d;
  --pe-err: #fca5a5;
  --pe-err-bg: #261315;
  --pe-err-line: #7f2a2f;
  --pe-ok: #6ee7b7;
  --pe-ok-bg: #0d2019;
  --pe-ok-line: #1d5c45;

  --pe-tp: #60a5fa;
  --pe-pcp: #fbbf24;
  --pe-dcp: #2dd4bf;
  --pe-pp: #c4b5fd;
  --pe-dp: #f9a8d4;
  --pe-ep: #fcd34d;
  --pe-sp: #22d3ee;
  --pe-uly: #6ee7b7;
  --pe-ring: #7dd3fc;
  --pe-cfg: #f0abfc;
  --pe-vae: #fdba74;
  --pe-txt: #c4b5fd;
}

/* ---------- 页头 ---------- */
.pe-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 1.1rem;
  padding-bottom: 0.9rem;
  border-bottom: 1px solid var(--pe-line);
}
.pe-eyebrow {
  margin: 0 0 0.5rem;
  color: var(--pe-accent);
  font-family: var(--md-code-font);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
}
.pe-head h2 {
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  color: var(--pe-fg);
  font-size: 1.28rem;
  font-weight: 760;
  line-height: 1.25;
  letter-spacing: -0.02em;
}
.pe-head .pe-lead {
  margin: 0.55rem 0 0;
  max-width: 46rem;
  color: var(--pe-dim);
  font-size: 0.72rem;
  line-height: 1.8;
}
.pe-lang {
  display: flex;
  flex: none;
  gap: 0;
  overflow: hidden;
  border: 1px solid var(--pe-line);
  border-radius: 0.4rem;
}
.pe-lang button {
  padding: 0.32rem 0.72rem;
  border: 0;
  background: transparent;
  color: var(--pe-dim);
  font-family: var(--md-code-font);
  font-size: 0.63rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  cursor: pointer;
}
.pe-lang button.on {
  background: var(--pe-fg);
  color: var(--pe-panel);
}

/* ---------- 通用面板 ---------- */
.pe-panel {
  margin-bottom: 1rem;
  padding: 1rem 1.05rem;
  border: 1px solid var(--pe-line);
  border-radius: 0.55rem;
  background: var(--pe-panel);
  box-shadow: var(--pe-shadow);
}
.pe-h {
  margin: 0 0 0.85rem;
  color: var(--pe-dim);
  font-family: var(--md-code-font);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}
.pe-h .pe-hn {
  color: var(--pe-dim);
  font-family: var(--md-text-font);
  font-size: 0.68rem;
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
}
.pe code,
.pe .pe-code {
  padding: 0.05rem 0.28rem;
  border-radius: 0.2rem;
  background: color-mix(in srgb, var(--pe-dim) 13%, transparent);
  color: inherit;
  font-family: var(--md-code-font);
  font-size: 0.92em;
  word-break: break-word;
}

/* ---------- 控件 ---------- */
.pe-cls {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 0.85rem;
}
.pe-clsbtn {
  padding: 0.36rem 0.95rem;
  border: 1px solid var(--pe-line);
  border-radius: 0.4rem;
  background: var(--pe-panel2);
  color: var(--pe-dim);
  font-size: 0.71rem;
  font-weight: 700;
  cursor: pointer;
  user-select: none;
}
.pe-clsbtn.on {
  border-color: var(--pe-fg);
  background: var(--pe-fg);
  color: var(--pe-panel);
}
.pe-ctl {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(8.4rem, 1fr));
  gap: 0.55rem;
}
.pe-ctl label {
  display: block;
  margin-bottom: 0.2rem;
  color: var(--pe-dim);
  font-size: 0.62rem;
  letter-spacing: 0.02em;
}
.pe select,
.pe input {
  width: 100%;
  padding: 0.34rem 0.42rem;
  border: 1px solid var(--pe-line);
  border-radius: 0.32rem;
  background: var(--pe-panel2);
  color: var(--pe-fg);
  font-family: inherit;
  font-size: 0.72rem;
}
.pe select:focus,
.pe input:focus {
  border-color: var(--pe-accent);
  outline: none;
}
.pe-d-tp label { color: var(--pe-tp); }
.pe-d-pcp label { color: var(--pe-pcp); }
.pe-d-dcp label { color: var(--pe-dcp); }
.pe-d-pp label { color: var(--pe-pp); }
.pe-d-dp label { color: var(--pe-dp); }
.pe-d-ep label { color: var(--pe-ep); }
.pe-d-uly label { color: var(--pe-uly); }
.pe-d-ring label { color: var(--pe-ring); }
.pe-d-cfg label { color: var(--pe-cfg); }
.pe-d-vae label { color: var(--pe-vae); }
.pe-divider {
  height: 1px;
  margin: 0.8rem 0;
  background: var(--pe-line);
}

/* ---------- 提示条 ---------- */
.pe-alert {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  margin-bottom: 0.5rem;
  padding: 0.55rem 0.75rem;
  border: 1px solid;
  border-radius: 0.4rem;
  font-size: 0.71rem;
  line-height: 1.7;
}
.pe-alert b { flex: none; font-weight: 700; }
.pe-alert.err { border-color: var(--pe-err-line); background: var(--pe-err-bg); color: var(--pe-err); }
.pe-alert.warn { border-color: var(--pe-warn-line); background: var(--pe-warn-bg); color: var(--pe-warn); }
.pe-alert.ok { border-color: var(--pe-ok-line); background: var(--pe-ok-bg); color: var(--pe-ok); }
.pe-alert code { background: color-mix(in srgb, currentColor 14%, transparent); }

/* ---------- KPI ---------- */
.pe-kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
  gap: 0.5rem;
}
.pe-kpi {
  padding: 0.55rem 0.7rem;
  border: 1px solid var(--pe-line);
  border-radius: 0.42rem;
  background: var(--pe-panel2);
}
.pe-kpi .k {
  color: var(--pe-dim);
  font-family: var(--md-code-font);
  font-size: 0.56rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.pe-kpi .v {
  margin-top: 0.15rem;
  font-size: 1.02rem;
  font-weight: 760;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.pe-kpi .n { margin-top: 0.1rem; color: var(--pe-dim); font-size: 0.62rem; }

/* ---------- rank 网格 ---------- */
.pe-rankgrid { display: flex; flex-wrap: wrap; gap: 0.28rem; }
.pe-rk {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 2.55rem;
  height: 2.2rem;
  border: 1px solid var(--pe-line);
  border-radius: 0.36rem;
  background: var(--pe-panel2);
  font-size: 0.66rem;
  font-variant-numeric: tabular-nums;
}
.pe-rk .t { color: var(--pe-dim); font-size: 0.5rem; line-height: 1.1; }
.pe-rk.self { border-color: var(--pe-accent); box-shadow: 0 0 0 1px var(--pe-accent) inset; font-weight: 700; }
.pe-rk.tpg { border-color: var(--pe-tp); }
.pe-rk.dcpg { box-shadow: 0 0 0 2px var(--pe-dcp) inset; }
.pe-rk.pcpg { outline: 2px dashed var(--pe-pcp); outline-offset: 1px; }
.pe-rk.spg { box-shadow: 0 0 0 2px var(--pe-sp) inset; }
.pe-rk.ulyg { border-color: var(--pe-uly); border-width: 2px; }
.pe-rk.ringg { outline: 2px dashed var(--pe-ring); outline-offset: 1px; }
.pe-rk.cfgg { background: color-mix(in srgb, var(--pe-cfg) 12%, var(--pe-panel2)); }
.pe-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 0.9rem;
  margin-top: 0.7rem;
  color: var(--pe-dim);
  font-size: 0.64rem;
}
.pe-legend i {
  display: inline-block;
  width: 0.62rem;
  height: 0.62rem;
  margin-right: 0.28rem;
  border-radius: 0.15rem;
  vertical-align: -1px;
}

/* ---------- 图卡 ---------- */
.pe-gcards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(26rem, 1fr));
  gap: 0.75rem;
}
.pe-gcard {
  padding: 0.7rem 0.7rem 0.45rem;
  border: 1px solid var(--pe-line);
  border-radius: 0.45rem;
  background: var(--pe-panel2);
}
.pe-gcard.wide { grid-column: 1 / -1; }
.pe-gcard.bare { padding: 0; border: 0; background: none; }
.pe-gcard .t { margin-bottom: 0.1rem; font-size: 0.74rem; font-weight: 700; }
.pe-gcard .t .badge {
  display: inline-block;
  margin-left: 0.4rem;
  padding: 0.02rem 0.42rem;
  border: 1px solid currentColor;
  border-radius: 1rem;
  font-family: var(--md-code-font);
  font-size: 0.54rem;
  letter-spacing: 0.03em;
  vertical-align: 2px;
}
.pe-gcard .d {
  margin-bottom: 0.35rem;
  color: var(--pe-dim);
  font-family: var(--md-code-font);
  font-size: 0.62rem;
  line-height: 1.55;
}
.pe-gcard svg { display: block; width: 100%; height: auto; }
.pe-gcard .f {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.6rem;
  margin-top: 0.25rem;
  color: var(--pe-dim);
  font-size: 0.63rem;
}
.pe-gcard .f b { color: var(--pe-fg); }

/* ---------- 数据流 ---------- */
.pe-flow { display: flex; flex-direction: column; }
.pe-stage {
  display: grid;
  grid-template-columns: 11.5rem 1fr 11.5rem;
  gap: 0.65rem;
  align-items: center;
  padding: 0.5rem 0.7rem;
  border: 1px solid var(--pe-line);
  border-left: 3px solid var(--pe-line);
  border-radius: 0.42rem;
  background: var(--pe-panel2);
}
.pe-stage .nm { font-size: 0.71rem; font-weight: 700; }
.pe-stage .nm small {
  display: block;
  color: var(--pe-dim);
  font-size: 0.6rem;
  font-weight: 400;
}
.pe-stage .sh {
  color: var(--pe-slate);
  font-family: var(--md-code-font);
  font-size: 0.62rem;
  line-height: 1.6;
}
.pe-stage .sh em { color: var(--pe-dim); font-style: normal; }
.pe-stage .rt {
  color: var(--pe-dim);
  font-size: 0.64rem;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.pe-stage .rt b { color: var(--pe-fg); font-weight: 700; }
.pe-stage.tp { border-left-color: var(--pe-tp); }
.pe-stage.attn { border-left-color: var(--pe-dcp); }
.pe-stage.txts { border-left-color: var(--pe-txt); }
.pe-stage.elem { border-left-color: var(--pe-line); opacity: 0.78; }
.pe-commbox {
  padding: 0.6rem 0.7rem;
  border: 1px solid var(--pe-warn-line);
  border-left: 3px solid var(--pe-warn);
  border-radius: 0.42rem;
  background: var(--pe-warn-bg);
}
.pe-commbox .top {
  display: grid;
  grid-template-columns: 11.5rem 1fr 11.5rem;
  gap: 0.65rem;
  align-items: center;
}
.pe-commbox .top .nm { color: var(--pe-warn); font-size: 0.71rem; font-weight: 700; }
.pe-commbox .top .nm small {
  display: block;
  color: var(--pe-dim);
  font-size: 0.6rem;
  font-weight: 400;
}
.pe-commbox .top .sh { color: var(--pe-slate); font-family: var(--md-code-font); font-size: 0.62rem; }
.pe-commbox .top .sh em { color: var(--pe-dim); font-style: normal; }
.pe-commbox .top .rt {
  color: var(--pe-dim);
  font-size: 0.64rem;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.pe-commbox .top .rt b { color: var(--pe-fg); }
.pe-commbox svg { display: block; width: 100%; height: auto; margin-top: 0.45rem; }
.pe-arrow {
  height: 0.6rem;
  margin-left: 1.4rem;
  border-left: 2px solid var(--pe-line);
}
.pe-tag {
  display: inline-block;
  margin-left: 0.35rem;
  padding: 0.02rem 0.36rem;
  border: 1px solid currentColor;
  border-radius: 1rem;
  font-family: var(--md-code-font);
  font-size: 0.53rem;
  letter-spacing: 0.03em;
  vertical-align: 1px;
}
.pe-tag.tp { color: var(--pe-tp); }
.pe-tag.pcp { color: var(--pe-pcp); }
.pe-tag.dcp { color: var(--pe-dcp); }
.pe-tag.ep { color: var(--pe-ep); }
.pe-tag.uly { color: var(--pe-uly); }
.pe-tag.ring { color: var(--pe-ring); }
.pe-tag.cfg { color: var(--pe-cfg); }
.pe-tag.sp { color: var(--pe-sp); }
.pe-tag.rep { color: var(--pe-dim); }

/* ---------- 时间线 ---------- */
.pe-tl { position: relative; height: 4.1rem; margin: 0.3rem 0 0.2rem; }
.pe-tl .track {
  position: absolute;
  top: 1.7rem;
  right: 0;
  left: 0;
  display: flex;
  overflow: hidden;
  height: 0.85rem;
  border: 1px solid var(--pe-line);
  border-radius: 0.45rem;
  background: var(--pe-panel2);
}
.pe-tl .seg { height: 100%; border-right: 1px solid var(--pe-panel); }
.pe-tl .flag { position: absolute; top: 0; width: 2px; height: 1.7rem; }
.pe-tl .flag i {
  position: absolute;
  top: -2px;
  left: -3px;
  width: 0.42rem;
  height: 0.42rem;
  border-radius: 50%;
}
.pe-tl .lab {
  position: absolute;
  top: 2.8rem;
  font-size: 0.55rem;
  white-space: nowrap;
  transform: translateX(-50%);
}

/* ---------- 表格 ---------- */
.pe-tblwrap { overflow-x: auto; }
.pe table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.68rem;
}
.pe th,
.pe td {
  padding: 0.36rem 0.48rem;
  border-bottom: 1px solid var(--pe-line);
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.pe th {
  color: var(--pe-dim);
  font-family: var(--md-code-font);
  font-size: 0.55rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.pe th:first-child,
.pe td:first-child { font-variant-numeric: normal; text-align: left; }
.pe td.mono {
  color: var(--pe-slate);
  font-family: var(--md-code-font);
  font-size: 0.6rem;
  text-align: left;
}
.pe tr.sum td { border-top: 2px solid var(--pe-line); border-bottom: 0; font-weight: 700; }
.pe tr.sec td {
  padding-top: 0.7rem;
  color: var(--pe-dim);
  font-family: var(--md-code-font);
  font-size: 0.55rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}
.pe-tabs { display: flex; gap: 0.35rem; margin-bottom: 0.7rem; }
.pe-tab {
  padding: 0.28rem 0.8rem;
  border: 1px solid var(--pe-line);
  border-radius: 0.35rem;
  background: var(--pe-panel2);
  color: var(--pe-dim);
  font-size: 0.68rem;
  cursor: pointer;
  user-select: none;
}
.pe-tab.on { border-color: var(--pe-fg); background: var(--pe-fg); color: var(--pe-panel); }

/* ---------- 条形图 ---------- */
.pe-bars { display: flex; flex-direction: column; gap: 0.36rem; }
.pe-bar {
  display: grid;
  grid-template-columns: 11rem 1fr 5.2rem;
  gap: 0.5rem;
  align-items: center;
  font-size: 0.63rem;
}
.pe-bar .track {
  overflow: hidden;
  height: 0.8rem;
  border: 1px solid var(--pe-line);
  border-radius: 0.28rem;
  background: var(--pe-panel2);
}
.pe-bar .fill { height: 100%; border-radius: 0.24rem 0 0 0.24rem; }
.pe-bar .val { color: var(--pe-dim); font-variant-numeric: tabular-nums; text-align: right; }
.pe-two { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }

/* ---------- 说明 ---------- */
.pe-note { color: var(--pe-dim); font-size: 0.7rem; line-height: 1.85; }
.pe-note b { color: var(--pe-fg); }
.pe-note ul { margin: 0.3rem 0 0.7rem; padding-left: 1.2rem; }
.pe-note li { margin: 0.18rem 0; }
.pe-pill {
  display: inline-block;
  margin-right: 0.35rem;
  margin-bottom: 0.25rem;
  padding: 0.08rem 0.48rem;

  /* ===================== 渲染 ===================== */
  function render() {
    var isD = CLS === "diffusion";
    $$(".pe-g-llm").forEach(function (e) { e.classList.toggle("pe-hide", isD); });
    $$(".pe-g-diff").forEach(function (e) { e.classList.toggle("pe-hide", !isD); });
    $("wl-llm").classList.toggle("pe-hide", isD);
    $("wl-diff").classList.toggle("pe-hide", !isD);
    $("cust-llm").classList.toggle("pe-hide", isD);
    $("cust-diff").classList.toggle("pe-hide", !isD);
    $("title").textContent = isD ? t("title_diff") : t("title_llm");
    $("lead").textContent = isD ? t("lead_diff") : t("lead_llm");
    $("srcs").innerHTML = (isD ? t("src_diff") : t("src_llm")) + (isD
      ? "<code>diffusion/distributed/parallel_state.py</code> · <code>config/omni_config.py</code> · " +
        "<code>diffusion/models/qwen_image/qwen_image_transformer.py</code> · " +
        "<code>diffusion/attention/parallel/{ulysses,ring}.py</code> · " +
        "<code>diffusion/distributed/{cfg_parallel,vae_patch_parallel}.py</code>"
      : "<code>distributed/parallel_state.py</code> · <code>config/parallel.py</code> · " +
        "<code>model_executor/layers/linear.py</code> · <code>v1/attention/backends/flash_attn.py</code> · " +
        "<code>v1/worker/gpu/pcp_manager.py</code> · <code>v1/attention/ops/common.py</code>");

    var models = isD ? MODELS_DIFF : MODELS_LLM;
    var want = Object.keys(models).join("|") + "|" + L;
    if ($("model").dataset.k !== want) {
      var prev = $("model").value;
      $("model").dataset.k = want;
      $("model").innerHTML = Object.keys(models).map(function (k) {
        return '<option value="' + k + '">' + esc(modelLabel(k)) + "</option>";
      }).join("");
      if (models[prev]) $("model").value = prev;
    }
    var c = readCfg();
    $("custom").classList.toggle("pe-hide", !models[c.name] || !models[c.name].custom);
    if ($("self").options.length !== c.world || $("self").dataset.l !== L) {
      $("self").dataset.l = L;
      var cur = +$("self").value || 0;
      var opts = "";
      for (var i = 0; i < c.world; i++) opts += '<option value="' + i + '">' + t("rank_opt") + i + "</option>";
      $("self").innerHTML = opts;
      $("self").value = String(Math.min(cur, c.world - 1));
      c = readCfg();
    }

    var errs = validate(c), fatal = errs.some(function (e) { return e[0] === "err"; });

  /* ---------- rank 网格 ---------- */
  function rankGridLLM(c, R) {
    var pp = c.pp, pcp = c.pcp, tp = c.tp, dcp = c.dcp, self = c.self;
    var idx = function (r) { return { pp: Math.floor(r / (pcp * tp)), pcp: Math.floor(r / tp) % pcp, tp: r % tp }; };
    var s = idx(self);
    var tpG = function (r) { var q = idx(r); return q.pp === s.pp && q.pcp === s.pcp; };
    var pcpG = function (r) { var q = idx(r); return q.pp === s.pp && q.tp === s.tp; };
    var dcpMembers = (function () {
      if (dcp <= 1) return [self];
      var order = [];
      for (var a = 0; a < pp; a++) for (var tt = 0; tt < tp; tt++) for (var p = 0; p < pcp; p++)
        order.push(a * pcp * tp + p * tp + tt);
      var gi = Math.floor(order.indexOf(self) / dcp);
      return order.slice(gi * dcp, (gi + 1) * dcp);
    })();
    var html = "";
    for (var a2 = 0; a2 < pp; a2++) {
      html += '<div style="margin-bottom:.5rem"><div style="font-size:.6rem;color:var(--pe-pp);margin-bottom:.2rem">PP stage ' + a2 +
        " · layers " + (a2 * R.dims.layersPerRank) + "–" + (Math.min(c.m.L, (a2 + 1) * R.dims.layersPerRank) - 1) +
        '</div><div class="pe-rankgrid">';
      for (var p2 = 0; p2 < pcp; p2++) {
        for (var t2 = 0; t2 < tp; t2++) {
          var r2 = a2 * pcp * tp + p2 * tp + t2, cls = ["pe-rk"];
          if (r2 === self) cls.push("self");
          if (tpG(r2)) cls.push("tpg");
          if (dcpMembers.indexOf(r2) >= 0) cls.push("dcpg");
          if (pcpG(r2)) cls.push("pcpg");
          html += '<div class="' + cls.join(" ") + '" title="pp=' + a2 + " pcp=" + p2 + " tp=" + t2 + '"><div>' + r2 +
            '</div><div class="t">' + p2 + "·" + t2 + "</div></div>";
        }
        if (pcp > 1) html += '<div style="width:.5rem"></div>';
      }
      html += "</div></div>";
    }
    $("rankgrid").innerHTML = html;
    $("ranklegend").innerHTML =
      '<span><i style="box-shadow:0 0 0 1px var(--pe-accent) inset"></i>' + t("lg_self") + "</span>" +
      '<span><i style="border:1px solid var(--pe-tp)"></i>' + t("lg_tp") + "</span>" +
      '<span><i style="box-shadow:0 0 0 2px var(--pe-dcp) inset"></i>' + t("lg_dcp") + "</span>" +
      '<span><i style="outline:2px dashed var(--pe-pcp);outline-offset:-2px"></i>' + t("lg_pcp") + "</span>";
    var tpList = [], pcpList = [], i;
    for (i = 0; i < tp; i++) tpList.push(s.pp * pcp * tp + s.pcp * tp + i);
    for (i = 0; i < pcp; i++) pcpList.push(s.pp * pcp * tp + i * tp + s.tp);
    $("grpnote").innerHTML = "<b>rank " + self + "</b>" + zhen(" 的通信组：", " communicates with: ") +
      "TP = [" + tpList.join(", ") + "]｜PCP = [" + pcpList.join(", ") + "]｜DCP = [" +
      dcpMembers.slice().sort(function (x, y) { return x - y; }).join(", ") + "]<br>" +
      (dcp > 1
        ? zhen("DCP 组由 <code>all_ranks.transpose(-1,-2).reshape(-1, dcp)</code> 构造：<b>先沿 PCP 轴、再沿 TP 轴</b>取 " + dcp + " 个 rank。",
          "The DCP group comes from <code>all_ranks.transpose(-1,-2).reshape(-1, dcp)</code>: it takes " + dcp + " ranks <b>along the PCP axis first, then across TP</b>.")
        : zhen("DCP=1，KV cache 不分片，每个 rank 持有完整序列的 KV。",
          "With DCP=1 the KV cache is not sharded; every rank holds the KV for the whole sequence."));
  }
  function rankGridDiff(c, R) {
    var tp = c.tp, sp = c.sp, pp = c.pp, cfg = c.cfg, uly = c.uly, ring = c.ring, self = c.self;
    var idx = function (r) {
      return { tp: r % tp, sp: Math.floor(r / tp) % sp, pp: Math.floor(r / (tp * sp)) % pp, cfg: Math.floor(r / (tp * sp * pp)) % cfg };
    };
    var s = idx(self);
    var sameTP = function (r) { var q = idx(r); return q.sp === s.sp && q.pp === s.pp && q.cfg === s.cfg; };
    var sameSP = function (r) { var q = idx(r); return q.tp === s.tp && q.pp === s.pp && q.cfg === s.cfg; };
    var sameCFG = function (r) { var q = idx(r); return q.tp === s.tp && q.sp === s.sp && q.pp === s.pp; };
    var sameUly = function (r) { var q = idx(r); return sameSP(r) && Math.floor(q.sp / uly) === Math.floor(s.sp / uly); };
    var sameRing = function (r) { var q = idx(r); return sameSP(r) && (q.sp % uly) === (s.sp % uly); };
    var html = "";
    for (var g = 0; g < cfg; g++) {
      var mine = [];
      for (var bi = 0; bi < R.dims.branches; bi++) if (bi % Math.min(cfg, R.dims.branches) === g % Math.min(cfg, R.dims.branches)) mine.push(bi);
      html += '<div style="margin-bottom:.6rem"><div style="font-size:.6rem;color:var(--pe-cfg);margin-bottom:.2rem">CFG ' +
        zhen("分支组 ", "branch group ") + g + " · " + zhen("负责分支 ", "handles branch ") +
        (mine.length ? mine.join(", ") : zhen("（空转）", "(idle)")) + "</div>";
      for (var a = 0; a < pp; a++) {
        html += '<div style="font-size:.58rem;color:var(--pe-pp);margin:.2rem 0 .15rem">PP stage ' + a + " · blocks " +
          (a * R.dims.layersPerRank) + "–" + (Math.min(c.m.L, (a + 1) * R.dims.layersPerRank) - 1) + '</div><div class="pe-rankgrid">';
        for (var p = 0; p < sp; p++) {
          for (var tt = 0; tt < tp; tt++) {
            var r = g * tp * sp * pp + a * tp * sp + p * tp + tt, cls = ["pe-rk"];
            if (r === self) cls.push("self");
            if (sameTP(r)) cls.push("tpg");
            if (sameSP(r)) cls.push("spg");
            if (uly > 1 && sameUly(r)) cls.push("ulyg");
            if (ring > 1 && sameRing(r)) cls.push("ringg");
            if (cfg > 1 && sameCFG(r)) cls.push("cfgg");
            html += '<div class="' + cls.join(" ") + '" title="tp=' + tt + " sp=" + p + " pp=" + a + " cfg=" + g + '"><div>' + r +
              '</div><div class="t">u' + (p % uly) + "·r" + Math.floor(p / uly) + "</div></div>";
          }
          if (sp > 1) html += '<div style="width:.5rem"></div>';
        }
        html += "</div>";
      }
      html += "</div>";
    }
    $("rankgrid").innerHTML = html;
    $("ranklegend").innerHTML =
      '<span><i style="box-shadow:0 0 0 1px var(--pe-accent) inset"></i>' + t("lg_self") + "</span>" +
      '<span><i style="border:1px solid var(--pe-tp)"></i>' + t("lg_tp") + "</span>" +
      '<span><i style="box-shadow:0 0 0 2px var(--pe-sp) inset"></i>' + t("lg_sp") + "</span>" +
      '<span><i style="border:2px solid var(--pe-uly)"></i>' + t("lg_uly") + "</span>" +
      '<span><i style="outline:2px dashed var(--pe-ring);outline-offset:-2px"></i>' + t("lg_ring") + "</span>" +
      '<span><i style="background:color-mix(in srgb,var(--pe-cfg) 30%,transparent)"></i>' + t("lg_cfg") + "</span>";
    var mem = function (f) { var o = []; for (var i = 0; i < c.world; i++) if (f(i)) o.push(i); return o.join(", "); };
    $("grpnote").innerHTML = "<b>rank " + self + "</b>" + zhen("：", ": ") +
      "TP = [" + mem(sameTP) + "]｜SP = [" + mem(sameSP) + "]｜Ulysses = [" + mem(sameUly) + "]｜Ring = [" + mem(sameRing) +
      "]｜CFG = [" + mem(sameCFG) + "]<br>" +
      zhen("<code>sequence_parallel_size = ulysses_degree × ring_degree = " + uly + " × " + ring + " = " + sp + "</code>（<code>omni_config.py:382</code>）；<code>use_ulysses_low=True</code> ⇒ <b>Ulysses 组取 SP 组内连续块，Ring 组按步长 " + uly + " 跨块</b>。",
        "<code>sequence_parallel_size = ulysses_degree × ring_degree = " + uly + " × " + ring + " = " + sp + "</code> (<code>omni_config.py:382</code>). With <code>use_ulysses_low=True</code>, <b>Ulysses groups are contiguous blocks inside the SP group and Ring groups stride across them with stride " + uly + "</b>.");
  }

    var dims = isD
      ? [["tp", "TP", "tp"], ["uly", "Ulysses", "uly"], ["ring", "Ring", "ring"], ["cfg", "CFG-P", "cfg"], ["pp", "PP", "pp"], ["vae", "VAE-P", "vae"]]
      : [["tp", "TP", "tp"], ["pcp", "PCP", "pcp"], ["dcp", "DCP", "dcp"], ["pp", "PP", "pp"]];
    var html = "<thead><tr><th>" + t("th_dim") + "</th><th>" + t("th_valid") + "</th>" +
      (isD ? "<th>" + t("th_bflop") + "</th><th>" + t("th_bcomm") + "</th><th>" + t("th_tflop") + "</th><th>" + t("th_tcomm") + "</th>"
           : "<th>" + t("th_pflop") + "</th><th>" + t("th_dflop") + "</th><th>" + t("th_pcomm") + "</th><th>" + t("th_dcomm") + "</th>") +
      "</tr></thead><tbody>";
    dims.forEach(function (row) {
      var key = row[0], lbl = row[1], cv = row[2];
      var ok = [], a1 = [], a2 = [], a3 = [], a4 = [];
      DIMS.forEach(function (v) {
        var cc = {}; for (var k in c) cc[k] = c[k];
        cc[key] = v; cc.self = 0;
        if (isD) { cc.sp = cc.uly * cc.ring; cc.world = cc.tp * cc.sp * cc.pp * cc.cfg * cc.dp; }
        else cc.world = cc.pp * cc.tp * cc.pcp;
        if (validate(cc).some(function (e) { return e[0] === "err"; })) {
          ok.push(false); a1.push(null); a2.push(null); a3.push(null); a4.push(null); return;
        }
        ok.push(true);
        if (isD) {
          var RR = computeDiff(cc);
          a1.push(RR.block.flopTotal); a2.push(RR.block.commTotal); a3.push(RR.totalFlop);
          a4.push((RR.block.commTotal * RR.dims.layersPerRank + RR.step.commTotal) * cc.steps + RR.vaeComm);
        } else {
          var RL = compute(cc);
          a1.push(RL.prefill.flopTotal); a2.push(RL.decode.flopTotal);
          a3.push(RL.prefill.commTotal); a4.push(RL.decode.commTotal);
        }
      });
      var mini = function (arr, fm) {
        return '<td style="font-size:.58rem;color:var(--pe-dim)">' + DIMS.map(function (d, i) {
          return arr[i] == null ? "<div>" + d + ": —</div>"
            : "<div" + (d === c[key] ? ' style="color:var(--pe-fg);font-weight:700"' : "") + ">" + d + ": " + fm(arr[i]) + "</div>";
        }).join("") + "</td>";
      };
      var f1 = fmtF, f2 = isD ? fmtB : fmtF, f3 = isD ? fmtF : fmtB, f4 = fmtB;
      html += '<tr><td style="color:var(--pe-' + cv + ');font-weight:700">' + lbl + '</td><td style="font-size:.58rem">' +
        DIMS.map(function (d, i) { return '<div style="color:' + (ok[i] ? "var(--pe-ok)" : "var(--pe-dim)") + '">' + d + ": " + (ok[i] ? "✓" : "✕") + "</div>"; }).join("") +
        "</td>" + mini(a1, f1) + mini(a2, f2) + mini(a3, f3) + mini(a4, f4) + "</tr>";
    });
    html += "</tbody>";
    $("sweep").innerHTML = '<div class="pe-tblwrap"><table class="pe-t">' + html + '</table></div><div class="pe-note" style="margin-top:.5rem">' + t("sw_foot") + "</div>";
  }

  /* ---------- 说明 ---------- */
  function notesLLM(c, R) {
    var m = c.m, tp = c.tp, dcp = c.dcp;
    var pills = '<div style="margin-top:.7rem"><span class="pe-pill">' + esc(modelLabel(c.name)) + '</span><span class="pe-pill">' +
      esc(modelNote(MODELS_LLM[c.name])) + '</span><span class="pe-pill">h=' + m.h + " · H=" + m.H + " · Hkv=" + m.Hkv +
      " · D=" + m.D + (m.E ? " · E=" + m.E + " topk=" + m.K : " · I=" + m.I) + " · L=" + m.L + "</span></div>";
    if (L === "en") return "" +
      "<b>1 · Rank layout and how the groups are built</b><ul>" +
      "<li>The global order is <code>ExternalDP × DP × PP × PCP × TP</code> and <code>world_size = PP × TP × PCP</code>. <b>PCP grows the process count; DCP does not</b> — it reuses existing ranks.</li>" +
      "<li>The DCP group is <code>transpose(-1,-2)</code> then " + dcp + " consecutive ranks: it fills the PCP axis first and only then crosses TP.</li>" +
      "<li>Constraints: with PCP=1, <code>tp % dcp == 0</code>; with PCP&gt;1, <code>dcp ∈ {1, PCP, TP×PCP}</code>; PCP and DP are mutually exclusive.</li></ul>" +
      "<b>2 · TP: column parallel is free, row parallel is not</b><ul>" +
      "<li>Column parallel cuts the output dimension, so each rank produces a disjoint slice of the result and nothing needs to be exchanged. Row parallel cuts the input dimension, so every rank ends up with a <b>partial sum</b> that must be all-reduced.</li>" +
      "<li>When there are fewer KV heads than TP ranks they get replicated (<code>max(1, Hkv // tp)</code>). This model has Hkv=" + m.Hkv + ", so beyond TP=" + m.Hkv + " extra tensor parallelism no longer shrinks the KV cache.</li>" +
      "<li>All-reduce volume is <code>2(P−1)/P · N · h</code>, essentially independent of TP. The larger TP grows, the less each rank computes and the more communication dominates.</li></ul>" +
      "<b>3 · PCP splits the rows of the score matrix</b><ul>" +
      "<li>Query rows are cut into <code>2×PCP</code> chunks and rank r takes chunk r together with chunk (2·PCP−1−r). Under a causal mask the early chunks have few active cells and the late ones have many, so pairing a head with a tail is what makes the load even.</li>" +
      "<li>Each layer all-gathers K/V before writing the cache, so <b>PCP does not reduce KV cache</b> — it replicates it PCP times. Decode requests are replicated as well.</li></ul>" +
      "<b>4 · DCP splits the columns and replicates the heads</b><ul>" +
      "<li>Key columns are interleaved by <code>(token_idx / interleave) % dcp</code>. Q is all-gathered along the head dimension so each rank computes every head of its group against its own key shard.</li>" +
      "<li><b>DCP does not reduce attention FLOPs</b> — heads ×dcp and keys ÷dcp leave the area unchanged. What it buys is KV memory and KV read bandwidth divided by dcp, which is exactly the bottleneck during decode.</li></ul>" +
      "<b>5 · Conventions</b><ul>" +
      "<li>GEMMs are counted as <code>2·M·K·N</code>; attention as <code>4 × active (q,k) pairs × heads × head_dim</code>.</li>" +
      "<li>Collectives use the ring cost per rank: all-reduce <code>2(P−1)/P·n</code>, all-gather and reduce-scatter <code>(P−1)·n</code>, all-to-all <code>(P−1)/P·n</code>.</li></ul>" + pills;
    return "" +
      "<b>1 · rank 布局与组的构造</b><ul>" +
      "<li>顺序 <code>ExternalDP × DP × PP × PCP × TP</code>，<code>world_size = PP × TP × PCP</code>；<b>PCP 撑大进程数，DCP 不会</b>。</li>" +
      "<li>DCP 组 = <code>transpose(-1,-2)</code> 后连续取 " + dcp + " 个 —— 先吃满 PCP 轴再跨 TP 轴。</li>" +
      "<li>约束：PCP=1 时 <code>tp % dcp == 0</code>；PCP&gt;1 时 <code>dcp ∈ {1, PCP, TP×PCP}</code>；PCP 与 DP 互斥。</li></ul>" +
      "<b>2 · TP：列并行不通信，行并行必通信</b><ul>" +
      "<li>列并行按输出维竖切，各 rank 输出不重叠 → 零通信；行并行按输入维横切，得到<b>部分和</b> → 必须 all-reduce。</li>" +
      "<li>KV heads 不足 TP 时被复制（<code>max(1, Hkv // tp)</code>），本模型 Hkv=" + m.Hkv + "，TP&gt;" + m.Hkv + " 后加 TP 不再减少 KV cache。</li>" +
      "<li>all-reduce 量 = <code>2(P−1)/P · N · h</code>，与 TP 大小几乎无关 ⇒ TP 越大通信占比越高。</li></ul>" +
      "<b>3 · PCP：切分数矩阵的「行」</b><ul>" +
      "<li>query 行切 <code>2×PCP</code> 块，rank r 取块 r 与块 (2·PCP−1−r)，因果 mask 下一头一尾配对才均衡。</li>" +
      "<li>每层 all-gather K/V 后写 cache；<b>PCP 不减少 KV cache</b>，反而按 PCP 倍冗余。decode 请求被复制。</li></ul>" +
      "<b>4 · DCP：切分数矩阵的「列」，同时复制「head」</b><ul>" +
      "<li>key 列按 <code>(token_idx / interleave) % dcp</code> 交错分片；Q 沿 head 维 all-gather 后本 rank 算全组 head。</li>" +
      "<li><b>DCP 不减少 attention FLOPs</b>（head ×dcp、key ÷dcp，面积不变），换来 KV 显存与读带宽 ÷ dcp。</li></ul>" +
      "<b>5 · 口径</b><ul>" +
      "<li>GEMM 计 <code>2·M·K·N</code>；attention 计 <code>4 × 有效 (q,k) 对数 × head 数 × head_dim</code>。</li>" +
      "<li>环形算法：all-reduce <code>2(P−1)/P·n</code>、all-gather / reduce-scatter <code>(P−1)·n</code>、all-to-all <code>(P−1)/P·n</code>。</li></ul>" + pills;
  }

  function notesDiff(c, R) {
    var m = c.m, uly = c.uly, ring = c.ring, sp = c.sp;
    var replPct = R ? (R.wReplBytes / R.weightBytesLayer * 100).toFixed(0) : "?";
    var Hl = R ? R.dims.Hl : "H/tp";
    var pills = '<div style="margin-top:.7rem"><span class="pe-pill">' + esc(modelLabel(c.name)) + '</span><span class="pe-pill">' +
      esc(modelNote(MODELS_DIFF[c.name])) + '</span><span class="pe-pill">dim=' + m.d + " · H=" + m.H + " · head_dim=" + m.D +
      " · ff=" + (m.d * m.mult) + " · L=" + m.L + " · in_ch=" + m.inCh + " · patch=" + m.patch + " · VAE ÷" + m.vaeScale + "</span></div>";
    if (L === "en") return "" +
      "<b>1 · Rank layout: <code>tp-sp-pp-cfg-dp</code></b><ul>" +
      "<li><code>world_size = tp × sp × pp × cfg × dp</code> (<code>diffusion/distributed/parallel_state.py:196</code>); TP is innermost, CFG is outermost apart from DP.</li>" +
      "<li><code>sequence_parallel_size = ulysses_degree × ring_degree</code> (<code>omni_config.py:382</code>); <code>allgather_degree</code> is mutually exclusive with both.</li>" +
      "<li>With the default <code>use_ulysses_low=True</code>, Ulysses groups are <b>contiguous blocks</b> inside the SP group and Ring groups <b>stride across</b> them with stride " + uly + ".</li>" +
      "<li>The EP group is <code>tp-sp-cfg-dp</code>. Enabling EP on a dense model raises <code>RuntimeError(\"Expert parallelism enabled for a non-MoE model\")</code>.</li>" +
      "<li>VAE-P is not part of world_size; it reuses existing ranks via <code>min(vae_patch_parallel_size, world_size)</code>.</li></ul>" +
      "<b>2 · Dual-stream MMDiT: the image is split, the text is replicated</b><ul>" +
      "<li>Every block carries <b>two complete sets</b> of norm / mod / mlp, and the streams only meet at attention where [txt ; img] is concatenated. That is why TP costs <b>four</b> all-reduces per layer here rather than the two you get in an LLM.</li>" +
      "<li><code>_sp_plan</code> shards only the image tokens (<code>split_dim=1</code>); <b>the text tokens are a full copy on every SP rank</b>. The larger SP gets, the more that duplicated text work stands out (" + (R ? fmtN(c.Ltxt) + " text vs " + fmtN(R.dims.NimgSp) + " image tokens per rank" : "") + ").</li>" +
      "<li><code>img_mod</code> and <code>txt_mod</code> are <b>ReplicatedLinear</b>, each <code>[" + m.d + ", 6×" + m.d + "]</code>, and are <b>never sharded by TP</b>. They account for " + replPct + "% of this layer's weights, which puts a hard floor under how much memory tensor parallelism can save.</li></ul>" +
      "<b>3 · Two routes for sequence parallelism</b><ul>" +
      "<li><b>Ulysses</b> issues four <code>all_to_all_single</code> calls (Q, K, V, out) to turn a sequence split into a head split. The volume is small — <code>(P−1)/P</code> of the local tensor each time — but it is <b>capped by the head count</b>: this rank holds only " + Hl + " heads, and a non-divisible count gets padded.</li>" +
      "<li><b>Ring</b> keeps the sequence split and walks the K/V around the ring for <code>world_size</code> steps (<code>for step in range(comm.world_size): comm.send_recv(k); comm.send_recv(v)</code>), merging results online with LSE. It moves more bytes (" + (ring > 1 ? ring - 1 : 0) + " steps × 2 tensors), but the traffic is <b>P2P and overlappable</b> and it is not limited by the head count — which makes it the only option once SP gets large.</li>" +
      "<li>The two compose: <code>SP = ulysses × ring</code>. Heads are swapped inside the Ulysses subgroup, then KV rotates between Ring subgroups.</li>" +
      "<li>In Ring, the text K/V is a <b>static joint prefix</b> (<code>joint_key/joint_value, joint_strategy=\"front\"</code>): it participates in every step and never rotates.</li></ul>" +
      "<b>4 · CFG-P and VAE-P operate at completely different granularities</b><ul>" +
      "<li><b>CFG-P</b> dispatches the " + (R ? R.dims.branches : 2) + " guidance branches round-robin with <code>branch i → rank (i % n_ranks)</code> (<code>_dispatch_branches</code>). Each rank runs only its own branch, the noise predictions are all-gathered <b>once per denoising step</b>, and then every rank does the CFG combine and the scheduler step locally — deterministic, so no broadcast is needed. With only " + (R ? R.dims.branches : 2) + " branches, CFG-P beyond " + (R ? R.dims.branches : 2) + " is wasted.</li>" +
      "<li><b>VAE-P</b> runs <b>once, at the very end</b>. Each rank decodes one latent block with a halo overlap to avoid seams, crops to the core, then all-gathers (<code>_distributed_patch_decode</code>). <code>vae_parallel_mode</code> selects <code>tile</code>, <code>spatial_shard_height</code> or <code>spatial_shard_width</code>.</li></ul>" +
      "<b>5 · The deepest difference from an LLM</b><ul>" +
      "<li><b>There is no KV cache.</b> Every denoising step recomputes all " + (R ? fmtN(R.dims.Limg) : "") + " image tokens from scratch, and attention is a <b>full non-causal matrix</b> rather than a lower triangle. Diffusion inference is therefore thoroughly <b>compute-bound</b>: the whole DCP/PCP family of KV-cache optimisations simply does not apply, and SP (split the sequence) plus CFG-P (split the branches) take their place.</li>" +
      "<li>Attention is <code>O(S²)</code> while S grows with the <b>square</b> of the resolution: " + c.imh + "×" + c.imw + " gives " + (R ? fmtN(R.dims.Limg) : "") + " image tokens, i.e. <code>(H/" + (m.vaeScale * m.patch) + ")×(W/" + (m.vaeScale * m.patch) + ")</code>. Doubling each side multiplies the token count by 4 and pushes attention towards 16× — slightly under, because the " + fmtN(c.Ltxt) + " text tokens are a fixed additive term. That is the reason SP exists.</li></ul>" +
      "<b>6 · Conventions</b><ul>" +
      "<li>GEMMs are counted as <code>2·M·K·N</code>; joint attention as <code>4 × S_q × S_k × heads × head_dim</code> (full matrix, non-causal).</li>" +
      "<li>Ulysses and EP all-to-alls use <code>(P−1)/P · n</code>; Ring uses <code>steps × n</code> (P2P, sent step by step); all-reduce <code>2(P−1)/P·n</code>; all-gather <code>(P−1)·n</code>.</li>" +
      "<li>The VAE's own FLOPs and the text encoder's FLOPs are excluded — this page is about the transformer blocks.</li></ul>" + pills;
    return "" +
      "<b>1 · rank 布局：<code>tp-sp-pp-cfg-dp</code></b><ul>" +
      "<li><code>world_size = tp × sp × pp × cfg × dp</code>（<code>diffusion/distributed/parallel_state.py:196</code>），TP 在最内层，CFG 在最外层（仅次于 DP）。</li>" +
      "<li><code>sequence_parallel_size = ulysses_degree × ring_degree</code>（<code>omni_config.py:382</code>）；<code>allgather_degree</code> 与二者互斥。</li>" +
      "<li><code>use_ulysses_low=True</code>（默认）⇒ Ulysses 组是 SP 组内的<b>连续块</b>，Ring 组按步长 " + uly + " <b>跨块</b>。</li>" +
      "<li>EP 组 = <code>tp-sp-cfg-dp</code>；对 dense 模型开 EP 会直接抛 <code>RuntimeError(\"Expert parallelism enabled for a non-MoE model\")</code>。</li>" +
      "<li>VAE-P 不进入 world_size，它复用已有 rank：<code>min(vae_patch_parallel_size, world_size)</code>。</li></ul>" +
      "<b>2 · MMDiT 双流：图像流被切、文本流被复制</b><ul>" +
      "<li>每个 block 有<b>两套完整的</b> norm / mod / mlp，attention 处才把 [txt ; img] 拼成 joint 序列一起算。因此 TP 的 all-reduce 是每层 <b>4 次</b>，不是 LLM 的 2 次。</li>" +
      "<li><code>_sp_plan</code> 只切图像 token（<code>split_dim=1</code>），<b>文本 token 在每个 SP rank 上都是完整副本</b>。SP 越大，文本流那份重复计算的占比越突出（当前 " + fmtN(c.Ltxt) + " txt vs " + (R ? fmtN(R.dims.NimgSp) : "") + " img/rank）。</li>" +
      "<li><code>img_mod</code> / <code>txt_mod</code> 是 <b>ReplicatedLinear</b>，各 <code>[" + m.d + ", 6×" + m.d + "]</code>，<b>TP 完全不切</b>。它们占单层权重的 " + replPct + "% —— 这意味着靠加 TP 省显存会遇到一个硬下限。</li></ul>" +
      "<b>3 · SP 的两条路线</b><ul>" +
      "<li><b>Ulysses</b>：4 次 <code>all_to_all_single</code>（Q、K、V、out），把「seq 切」换成「head 切」。通信量小（每次 <code>(P−1)/P × 本地张量</code>），但<b>受 head 数限制</b>：每 rank 只有 " + Hl + " 个 head，不整除时会 pad。</li>" +
      "<li><b>Ring</b>：seq 保持切分，K/V 沿环轮转 <code>world_size</code> 步（<code>for step in range(comm.world_size): comm.send_recv(k); comm.send_recv(v)</code>），结果按 LSE 在线合并。总字节更多（" + (ring > 1 ? ring - 1 : 0) + " 步 × 2 个张量），但是 <b>P2P、可与计算 overlap</b>，且不受 head 数限制 —— 这是把 SP 推到很大时的唯一选择。</li>" +
      "<li>两者可以叠加：<code>SP = ulysses × ring</code>，先在 ulysses 子组内换 head，再在 ring 子组间转 KV。</li>" +
      "<li>文本的 K/V 在 Ring 里作为 <b>joint 静态前缀</b>（<code>joint_key/joint_value, joint_strategy=\"front\"</code>）每步都参与、不参与轮转。</li></ul>" +
      "<b>4 · CFG 并行与 VAE 并行的粒度完全不同</b><ul>" +
      "<li><b>CFG-P</b>：把 " + (R ? R.dims.branches : 2) + " 个引导分支按 <code>branch i → rank (i % n_ranks)</code> 分派（<code>_dispatch_branches</code>），每 rank 只跑自己的分支，<b>每个去噪步</b> all-gather 一次噪声预测，然后各自本地做 CFG 组合与 scheduler step（确定性，不需要 broadcast）。分支数只有 " + (R ? R.dims.branches : 2) + " 个，所以 CFG-P &gt; " + (R ? R.dims.branches : 2) + " 没有意义。</li>" +
      "<li><b>VAE-P</b>：只在<b>整次生成的最后</b>做一次。每 rank 解码一块 latent（带 halo 重叠以避免接缝），裁到 core 后 all-gather（<code>_distributed_patch_decode</code>）；<code>vae_parallel_mode</code> 可选 <code>tile</code> / <code>spatial_shard_height</code> / <code>spatial_shard_width</code>。</li></ul>" +
      "<b>5 · 与 LLM 最本质的差别</b><ul>" +
      "<li><b>没有 KV cache</b>。每个去噪步都要把全部 " + (R ? fmtN(R.dims.Limg) : "") + " 个 image token 从头算一遍，而且 attention 是<b>非因果的全矩阵</b>。因此扩散推理是彻头彻尾的 <b>compute-bound</b>，DCP / PCP 那套围绕 KV cache 的优化在这里完全用不上，取而代之的是 SP（切序列）与 CFG-P（切分支）。</li>" +
      "<li>attention 是 <code>O(S²)</code>，而 S 随分辨率<b>平方</b>增长：" + c.imh + "×" + c.imw + " → " + (R ? fmtN(R.dims.Limg) : "") + " image tokens（<code>(H/" + (m.vaeScale * m.patch) + ")×(W/" + (m.vaeScale * m.patch) + ")</code>）。边长翻倍 ⇒ token 数 ×4 ⇒ attention 趋近 ×16（因为文本那 " + fmtN(c.Ltxt) + " 个 token 是固定加项，实际倍数略低于 16）。这就是 SP 存在的理由。</li></ul>" +
      "<b>6 · 计算量与通信量口径</b><ul>" +
      "<li>GEMM 计 <code>2·M·K·N</code>；joint attention 计 <code>4 × S_q × S_k × head 数 × head_dim</code>（非因果，全矩阵）。</li>" +
      "<li>Ulysses/EP 的 all-to-all 按 <code>(P−1)/P · n</code>；Ring 按 <code>steps × n</code>（P2P）；all-reduce <code>2(P−1)/P·n</code>；all-gather <code>(P−1)·n</code>。</li>" +
      "<li>VAE 编解码器本身的 FLOPs、text encoder 的 FLOPs 未计入（本页聚焦 transformer 层）。</li></ul>" + pills;
  }

  function shell() {

      '<div class="pe-head"><div><p class="pe-eyebrow">' + t("eyebrow") + '</p>' +
      '<h2 id="pe-title"></h2><p class="pe-lead" id="pe-lead"></p>' +

      '<div class="pe-lang"><button data-lang="zh">中文</button><button data-lang="en">EN</button></div></div>' +

  function snapshot() {
    var o = {};
    $$("select,input").forEach(function (e) { if (e.id) o[e.id] = e.value; });
    return o;
  }
  function restore(o) {
    Object.keys(o).forEach(function (id) {
      var e = root.querySelector("#" + id);
      if (e && o[id] !== undefined && o[id] !== "") {
        if (e.tagName === "SELECT") {
          for (var i = 0; i < e.options.length; i++) if (e.options[i].value === o[id]) { e.value = o[id]; return; }
        } else e.value = o[id];
      }
    });
  }

  function build(keepState) {
    var state = keepState ? snapshot() : null;
    root.className = "pe";
    root.innerHTML = shell();
    if (state) restore(state);
    $$(".pe-clsbtn").forEach(function (b) {
      b.classList.toggle("on", b.dataset.cls === CLS);
      b.addEventListener("click", function () {
        if (CLS === b.dataset.cls) return;
        CLS = b.dataset.cls;
        $$(".pe-clsbtn").forEach(function (x) { x.classList.toggle("on", x.dataset.cls === CLS); });
        render();
      });
    });
    $$(".pe-lang button").forEach(function (b) {
      b.classList.toggle("on", b.dataset.lang === L);
      b.addEventListener("click", function () {
        if (L === b.dataset.lang) return;
        L = b.dataset.lang;
        try { localStorage.setItem("pe-lang", L); } catch (e) {}
        build(true);
      });
    });
    $$(".pe-tab").forEach(function (tb) {
      tb.classList.toggle("on", tb.dataset.ph === PHASE);
      tb.addEventListener("click", function () {
        $$(".pe-tab").forEach(function (x) { x.classList.remove("on"); });
        tb.classList.add("on"); PHASE = tb.dataset.ph; render();
      });
    });
    $$("select,input").forEach(function (e) {
      e.addEventListener("change", render);
      e.addEventListener("input", render);
    });
    render();
  }

  function init() {
    root = document.getElementById("pe-root");
    if (!root) return;
    build(false);
    // 跟随站点明暗主题切换重绘（SVG 里的分片色是按主题算的）
    if (window.MutationObserver) {
      var mo = new MutationObserver(function (recs) {
        for (var i = 0; i < recs.length; i++) if (recs[i].attributeName === "data-md-color-scheme") { render(); return; }
      });
      mo.observe(document.body, { attributes: true, attributeFilter: ["data-md-color-scheme"] });
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

  // 便于离线单文件版与自动化测试调用
  window.ParallelismExplorer = {
    compute: compute, computeDiff: computeDiff, validate: validate, readCfg: readCfg,
    render: render, setLang: function (v) { L = v; build(true); }, setCls: function (v) { CLS = v; render(); },
    MODELS_LLM: MODELS_LLM, MODELS_DIFF: MODELS_DIFF
  };
})();
