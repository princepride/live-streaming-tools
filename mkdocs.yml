site_name: vLLM 小课堂技术博客
site_description: 从技术视频与课件整理而来的中英文深度技术文章
site_url: https://princepride.github.io/live-streaming-tools/
repo_url: https://github.com/princepride/live-streaming-tools
repo_name: princepride/live-streaming-tools
docs_dir: tech_blog_output
site_dir: site

exclude_docs: |
  **/cache/**
  **/drafts/**
  **/run.json
  **/final/*.docx
  **/final/*.pdf
  **/final/qa-report.json
  **/final/sources.json

theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - 互动工具:
      - 并行切分可视化 · Parallelism Explorer: parallelism_explorer/index.md
  - 中文博客:
      - vLLM-Omni Diffusion Continuous Batching 与 PiD: vllm_omni_diffusion_continuous_batching/final/blog.md
      - 大模型推理的内存与计算解耦：AFD 与 FastAFD: fastafd_vllm_plugin/final/blog.md
      - vLLM PCP 与 DCP 上下文并行: vllm_pcp_dcp/final/blog.md
      - vLLM Rust 前端架构演进: vllm_rust_frontend_refactor/final/blog.md
      - MiniMax-H3 与 vLLM-Omni 音视频联合生成: minimax_h3_vllm_omni/final/blog.md
      - Kimi K3 day-0支持背后的技术细节: kimi_k3_vllm/final/blog.md
      - DSpark 投机解码: dspark_speculative_decoding/final/blog.md
      - vLLM KV Connector: vllm_kv_connector/final/blog.md
      - 长序列 MoE RL: long_sequence_moe_rl/final/blog.md
      - 当 vLLM 遇见 slime: vllm_slime_rl_support/final/blog.md
      - veRL-Omni 多模态强化学习: verl_omni_multimodal_rl/final/blog.md
      - vLLM 低比特量化实践：AutoRound: auto_round_vllm_vlm_low_bit/final/blog.md
      - GLM-5 昇腾推理优化: ascend_glm5_deployment/final/blog.md
  - English:
      - vLLM-Omni Diffusion Continuous Batching and PiD: vllm_omni_diffusion_continuous_batching/final/blog.en.md
      - Memory–Compute Disaggregation with AFD and FastAFD: fastafd_vllm_plugin/final/blog.en.md
      - vLLM PCP and DCP Context Parallelism: vllm_pcp_dcp/final/blog.en.md
      - Architectural Evolution of the vLLM Rust Frontend: vllm_rust_frontend_refactor/final/blog.en.md
      - Joint Audio-Video Generation with MiniMax-H3 and vLLM-Omni: minimax_h3_vllm_omni/final/blog.en.md
      - The technical details behind Kimi K3's Day-0 support: kimi_k3_vllm/final/blog.en.md
      - DSpark Speculative Decoding: dspark_speculative_decoding/final/blog.en.md
      - vLLM KV Connector: vllm_kv_connector/final/blog.en.md
      - Long-Sequence MoE RL: long_sequence_moe_rl/final/blog.en.md
      - When vLLM Meets slime: vllm_slime_rl_support/final/blog.en.md
      - Core Architecture of VeRL-Omni: verl_omni_multimodal_rl/final/blog.en.md
      - Low-Bit Quantization with AutoRound: auto_round_vllm_vlm_low_bit/final/blog.en.md
      - GLM-5 Ascend Inference Optimization: ascend_glm5_deployment/final/blog.en.md

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

copyright: 内容来自 vLLM 小课堂技术分享，本站由 MkDocs 构建
